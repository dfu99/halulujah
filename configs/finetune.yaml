lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "all-linear"

sft:
  num_train_epochs: 50
  learning_rate: 5.0e-6
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_checkpointing: true
  warmup_ratio: 0.2
  lr_scheduler_type: "cosine"
  max_length: 2048
  packing: true
  bf16: true
  logging_steps: 20
  save_total_limit: 1
  seed: 0
  gradient_accumulation_steps: 1
  deepspeed: null  # set to "configs/deepspeed_stage2.json" for multi-GPU
  train_split_ratio: 0.9
