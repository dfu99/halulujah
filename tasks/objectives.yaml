  - id: obj-012
    status: completed
    statement: "Paper revision addresses all 5 unanimous reviewer critiques, upgrades consensus to Minor Revision"
    methodology: >
      Computed bootstrap 95% CIs (10K resamples) on all 90 collab pairs and 10 solo baselines.
      Ran two-way ANOVA for variance decomposition (primary domain × helper domain).
      Classified 1,101 failed chains into failure modes. Revised full paper: scoped title,
      replaced anthropomorphic language, integrated statistical analyses. Re-simulated 5 expert
      reviewers on revised paper.
    metrics:
      bootstrap_ci_width_mean: "±17.9pp"
      anova_primary_eta_sq: 0.131
      anova_primary_F: 29.25
      anova_primary_p: "<0.001"
      anova_helper_eta_sq: 0.005
      failure_confident_wrong: "49.6%"
      failure_extraction: "29.2%"
      failure_answer_switch: "21.2%"
      success_correction_rate: "17.9%"
      round1_verdict: "5/5 Major Revision"
      round2_verdict: "4/5 Minor, 1/5 Accept"
    figures:
      - results/pace_domain_10/figures/paper_summary_4panel.png
      - results/pace_domain_10/figures/bootstrap_ci_forest.png
      - results/pace_domain_10/figures/chain_failure_modes.png
      - results/pace_domain_10/figures/variance_decomposition.png
    conclusions: >
      The revised paper successfully addresses all 5 unanimous reviewer critiques.
      ANOVA shows primary domain explains 26x more variance than helper (13.1% vs 0.5%),
      providing statistical rigor for the intrinsic vulnerability claim. Chain analysis
      reveals answer switching (21.2%) as the key harmful mechanism. All 5 reviewers
      upgraded from Round 1, with consensus moving from Major to Minor Revision.
    connects_to: obj-013
    completed_date: "2026-04-02"

  - id: obj-013
    status: completed
    statement: "Base Qwen3-1.7B scores 15.4% on MMLU — 35pp below LoRA specialists"
    methodology: >
      Evaluated raw Qwen3-1.7B (no LoRA) across all 10 MMLU domains with 50 questions
      each using identical test splits (seed=42) and grading pipeline as specialist
      experiments. Ran on RunPod RTX A4500. Compared against specialist solo baselines
      averaged across 3 communication protocols.
    metrics:
      base_mean_accuracy: 15.4
      specialist_mean_accuracy: 50.4
      accuracy_gap_pp: 35.0
      base_best_domain: "biology/economics (24%)"
      base_worst_domain: "CS/history/math (8%)"
