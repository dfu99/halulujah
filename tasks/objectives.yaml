  conclusions: >
    The audit §6f as-written prediction "clustering would widen the CI"
    was empirically wrong; clustering tightens here. Reason: within-cell
    bootstrap injects independent noise into all 30 cells, allowing
    cell-level deltas to drift in arbitrary directions. The clustered
    bootstrap forces cells in the same row to share question samples,
    preserving the row-level structure and making the row-spread/col-
    spread ratio less responsive to within-cell noise. The clustered CI
    is the correct uncertainty estimate; within-cell over-estimates on
    both ends. Defensible paper headline strengthens to **WHO-asymmetry
    ratio = 4.47× (95% CI 2.20–7.45)**, with P(ratio > 1) = 100% and
    P(ratio > 2) = 99.1%.
