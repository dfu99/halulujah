    balanced collaboration. However, switching still biased toward harmful in most pairs
    (mean 3.6x). The fix is substantial but incomplete — mediators are no longer
    catastrophic but still not reliably beneficial.
  connects_to: null
  completed_date: "2026-04-14"

- id: obj-010b
  statement: "3.4x harmful switching ratio invariant across 3 communication protocols"
  methodology: >
    Ran cross-domain LoRA specialist collaboration on 10 domains × 9 partners × 50
    questions = 5000 trials for each of 3 communication protocols: full-cot (share
    complete chain-of-thought), answer-only (share 1-sentence summary), and structured
    (answer + confidence + key reasoning). For each protocol, measured correct-to-wrong
    (C2W) and wrong-to-correct (W2C) switch rates to compute the harmful/helpful ratio.
    All specialists were Qwen3-1.7B with old LoRA training (non-reasoning-preserved).
  metrics:
    n_trials_per_protocol: 5000
    full_cot_c2w: 26.3
    full_cot_w2c: 7.7
    full_cot_ratio: 3.4
    answer_only_c2w: 29.4
    answer_only_w2c: 8.5
    answer_only_ratio: 3.5
    structured_c2w: 27.0
    structured_w2c: 7.9
    structured_ratio: 3.4
    ratio_range: "3.4-3.5x across all protocols"
  figures:
    - results/runpod_domain/protocol_invariance.png
  conclusions: >
    The harmful switching ratio is approximately 3.4x across all three protocols
    regardless of how much information agents share. Restricting communication from
    full CoT to answer-only summaries does not mitigate the harm — the damage is
    intrinsic to cross-domain LoRA collaboration, not to the protocol. This rules
    out information overload as the mechanism: even with minimal information
    exchange, the ratio is invariant. Later work (obj-017, obj-020) showed the
    mechanism is reasoning suppression in LoRA training, not protocol design.
  connects_to: obj-011
  completed_date: "2026-04-07"

- id: obj-008b
  statement: "Bootstrap CIs confirm n=20 is too small to detect typical effects"
  methodology: >
    Computed bootstrap 95% confidence intervals on all 100 conditions from the 10-domain
    PACE collaboration study (10 solo + 90 cross-domain pairs), each at n=20 questions.
    Measured CI width per condition to quantify the minimum detectable effect size.
    Compared observed effect sizes (collaboration deltas) against their CI widths to
    count statistically distinguishable results.
  metrics:
    n_conditions: 100
    n_per_condition: 20
    mean_ci_width_pp: 36.1
    mean_ci_half_width_pp: 18.4
    solo_ci_width_pp: 40.0
    collab_mean_ci_width_pp: 35.7
    min_detectable_effect_pp: 36
    implication_for_n200: "expected CI half-width ±5.7pp (3.2× tighter)"
  figures:
    - results/pace_domain_10/bootstrap_cis.png
  conclusions: >
    At n=20 per condition, bootstrap 95% CIs have mean half-width ±18.4pp. Effects
    smaller than ~36pp are statistically indistinguishable from noise. Only catastrophic
    results (e.g., medicine -45pp cross-domain) and some clear wins (math+biology +20pp)
    reliably exceeded this threshold. This quantified the noise floor and directly
    motivated scaling to N=200 in the A5000 paper sweep (obj-022+), where CI half-widths
    shrink to ~±5.7pp and effects as small as ±12pp become detectable.
  connects_to: obj-012
  completed_date: "2026-04-02"

