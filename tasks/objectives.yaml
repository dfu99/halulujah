# Objectives Log — Structured scientific progress tracking
# Each completed task should be logged here as an objective.
# The morning report reads this file to generate PI briefing slides.
#
# Rules:
#   - statement: ≤20 words, clear and direct
#   - Every objective MUST have at least one figure before completion
#   - metrics: extract all numbers (accuracy, loss, counts, timings)
#   - conclusions: 1-2 sentences explaining what the result means

objectives:
  - id: obj-001
    status: completed
    statement: "Literature survey confirms both pivot directions are novel research gaps"
    methodology: >
      Searched 2023-2026 literature for personality fingerprinting (fine-tuning on
      individual humans + temperature erosion) and domain-bounded ignorance (trained
      confusion + complexity thresholds). Identified key papers and mapped novelty gaps.
    metrics:
      papers_reviewed_pivot_a: 9
      papers_reviewed_pivot_b: 12
      novelty_gaps_identified: 2
    figures:
      - figures/pivot_novelty_landscape.png
    conclusions: >
      Both directions occupy genuine gaps. Pivot A (persona token distribution shift +
      temperature erosion) has no direct precedent. Pivot B (complexity-gated confusion
      as learned behavior) sits at an unoccupied intersection of unlearning, abstention,
      and multi-agent specialization.
    connects_to: obj-002
    completed_date: "2026-03-20"

  - id: obj-002
    status: completed
    statement: "Drafted 4-phase experiment plans for both personality and domain pivots"
    methodology: >
      Designed experiment plans grounded in existing halulujah infrastructure (SFT LoRA,
      eval sweeps, oracle/reward, PPO trainer). Identified reusable modules and new code
      needed for each pivot.
    metrics:
      phases_per_pivot: 4
      reusable_modules: 6
      new_modules_needed_a: 4
      new_modules_needed_b: 4
    figures:
      - figures/pivot_novelty_landscape.png
    conclusions: >
      Pivot A has a tighter experimental loop and can produce a first publishable figure
      in 1-2 weeks. Pivot B is more novel but requires more data engineering. Both reuse
      the existing fine-tuning and evaluation infrastructure heavily.
    connects_to: obj-003
    completed_date: "2026-03-20"

  - id: obj-003
    status: completed
    statement: "Built blog author feasibility test to check embedding-level persona separability"
    methodology: >
      Wrote script that loads Blog Authorship Corpus, embeds posts with MiniLM-L6-v2,
      computes intra vs inter-author cosine distances, trains 5-fold logistic regression
      on author ID, and generates 3-panel visualization. Created SLURM job for PACE
      with scratch storage. Decision gate: proceed if accuracy > 2x chance.
    metrics:
      authors_tested: 10
      min_posts_per_author: 50
      max_posts_per_author: 100
      embedding_model: "all-MiniLM-L6-v2"
      classifier: "logistic_regression_5fold"
    figures:
      - figures/blog_feasibility_pipeline.png
    conclusions: >
      Infrastructure ready to test whether blog authors are separable at the embedding
      level without fine-tuning. Result pending PACE job submission. Pivoted from
      PANDORA (gated) to Blog Authorship Corpus (open access).
    connects_to: obj-004
    completed_date: "2026-03-20"

  - id: obj-004
    status: completed
    statement: "Blog authors separable at 53% accuracy vs 10% chance without fine-tuning"
    methodology: >
      Downloaded Blog Authorship Corpus (681K posts, 19K authors) to PACE scratch.
      Embedded 1000 posts (100 per author, 10 authors) with MiniLM-L6-v2. Computed
      intra vs inter-author cosine distances. Trained 5-fold logistic regression on
      embeddings. Generated t-SNE, distance, and accuracy visualization.
    metrics:
      classification_accuracy: 53.1
      chance_level: 10.0
      accuracy_over_chance: 5.3
      separation_ratio: 1.10
      intra_author_distance: 0.814
      inter_author_distance: 0.893
      authors_tested: 10
      posts_per_author: 100
      total_posts_loaded: 634387
      eligible_authors: 2640
      slurm_job_id: 5225817
      walltime_seconds: 49
    figures:
      - results/blog_feasibility/blog_author_feasibility.png
    conclusions: >
      Authors are clearly separable at the embedding level without any fine-tuning.
      53% accuracy is 5.3x chance, crossing the 2x decision threshold. This validates
      proceeding to per-author LoRA fine-tuning to measure whether fine-tuning amplifies
      the persona signal and whether temperature erodes it.
    connects_to: null
    completed_date: "2026-03-21"

