      total_walltime_minutes: 24
      slurm_job_id: 5357133
      gpu: "A100-80GB"
    figures:
      - figures/phase1_training_summary.png
    conclusions: >
      All 5 adapters trained successfully. Eval loss variation (2.20-2.77) across
      authors reflects genuine style entropy differences — a positive signal for
      persona distinguishability. Phase 2+3 (measurement + erosion) submitted.
    connects_to: obj-006
    completed_date: "2026-03-22"

  - id: obj-006
    status: completed
    statement: "Persona fingerprint confirmed: KL drops 3000x from T=0.1 to T=2.0"
    methodology: >
      Ran 20 topic-controlled probes through base + 5 persona models. Captured
      full logit distributions at 50 token positions. Computed KL(persona||base),
      pairwise KL, embedding distances, and vocabulary fingerprints. Then swept
      7 temperatures measuring all metrics. PACE A100, 1h53m total.
    metrics:
      kl_vs_base_at_T1: 29.4
      pairwise_kl_at_T1: 7.7
      kl_vs_base_at_T01: 3036.75
      kl_vs_base_at_T20: 1.05
      kl_erosion_factor: 2892
      pairwise_kl_at_T01: 891.08
      pairwise_kl_at_T20: 0.14
      pairwise_erosion_factor: 6365
      embedding_separation_ratio: 1.05
      embedding_separation_stable: true
      temperatures_tested: 7
      probes_per_model: 20
      slurm_job_id: 5358810
      walltime_minutes: 113
    figures:
      - figures/persona_fingerprint_results.png
    conclusions: >
      Fine-tuning creates a strong, measurable persona fingerprint (~29 nats KL from
      base). Temperature erosion is dramatic: token-level persona signal drops ~3000x
      from T=0.1 to T=2.0, and pairwise KL collapses from 891 to 0.14 (personas
      become indistinguishable). However, coarse embedding separation (~1.05) persists
      across all temperatures. This validates KL divergence as a reliable tool for
      measuring distributional differences between fine-tuned models — the measurement
      infrastructure for Pivot B (domain collaboration) is proven.
    connects_to: obj-007
    completed_date: "2026-03-22"

  - id: obj-007
    status: completed
    statement: "Local experiments show prompt-only domain specialization hurts MCQ accuracy"
    methodology: >
      Ran cross-domain eval locally using qwen3:1.7b via Ollama with 4 variants
      (base + 3 domain expert system prompts) on 30 MMLU questions per domain
      (physics/law/biology). Graded by answer letter extraction.
    metrics:
      base_physics_accuracy: 36.7
      base_law_accuracy: 26.7
      base_biology_accuracy: 26.7
      expert_physics_on_physics: 6.7
      expert_law_on_law: 3.3
      expert_biology_on_biology: 43.3
      expert_law_on_biology: 53.3
      runtime_minutes: 65
      gpu: "RTX 3060"
    figures:
      - results/local_domain/local_cross_domain_accuracy.png
    conclusions: >
      Expert system prompts DECREASE MCQ accuracy on qwen3:1.7b compared to base
      model. The model overthinks with domain prompting (longer CoT, worse answer
      extraction). Surprising cross-domain boost: law expert scores 53% on biology
      (vs 27% base). Prompt-only specialization is not equivalent to LoRA.
    connects_to: obj-008
    completed_date: "2026-03-29"

  - id: obj-008
    status: completed
    statement: "Prompt-only personas are more separable at embedding level than LoRA"
    methodology: >
      Ran 3 persona probes (teen gamer, academic philosopher, practical nurse) on
      qwen3:1.7b via Ollama with 20 shared questions. Embedded responses with
      MiniLM-L6-v2, computed cosine distances and 5-fold logistic regression.
      Compared to PACE LoRA results (5 blog author adapters).
    metrics:
      prompt_sep_ratio: 1.195
      prompt_classification: 92
      prompt_chance: 33
      lora_sep_ratio: 1.051
      lora_kl_vs_base: 29.4
      runtime_minutes: 4.2
    figures:
      - results/local_persona/local_persona_probe.png
      - figures/prompt_vs_lora_comparison.png
    conclusions: >
      Prompt-only personas produce stronger embedding-level separation (1.195 vs 1.051)
      and higher classification accuracy (92% vs comparable). But LoRA captures deeper
      token-level distributional shifts (KL ~29 nats) invisible at the embedding level.
      Prompting = surface style, LoRA = deep distribution shift. Both have value for
      different measurement goals.
    connects_to: obj-009
    completed_date: "2026-03-29"

  - id: obj-009
    status: completed
    statement: "RunPod LoRA domain experiment: KL vs hallucination correlation r=0.715"
    methodology: >
      Trained 3 LoRA domain specialists (physics, law, biology) on Qwen3-1.7B using
      MMLU subsets on RunPod RTX 3090. Cross-domain evaluation (4 models × 3 domains
      × 50 questions). Pairwise KL divergence on 30 prompts. Correlated KL distance
      with cross-domain accuracy drop.
    metrics:
      base_accuracy: 18
      physics_in_domain: 54
      law_in_domain: 46
      biology_in_domain: 70
      biology_cross_domain: 53
      kl_biology_law: 3.78
      kl_biology_physics: 4.12
