      solo_baselines: 3
      reasoning_rounds: 3
      questions_per_pair: 20
      total_inference_chains: 180
    figures:
      - results/runpod_domain/figures/collaboration_results.png
    conclusions: >
      Phase 4 built and validated on RunPod with 3 domains. Collaboration delta
      ranges from -10% to +10%, showing the protocol can detect both help and harm.
    connects_to: obj-011
    completed_date: "2026-03-31"

  - id: obj-011
    status: completed
    statement: "10-domain collaboration experiment reveals systematic reasoning collapse patterns"
    methodology: >
      Ran full 4-phase pipeline on PACE V100: trained 10 domain LoRA adapters on
      Qwen3-1.7B MMLU subsets, cross-evaluated all 11 models on 500 questions,
      then tested all 90 ordered collaboration pairs (20 questions each, 3 alternating
      CoT rounds). Compared collab accuracy vs solo baselines.
    metrics:
      total_collab_pairs: 90
      pairs_hurt: 50
      pairs_helped: 34
      pairs_neutral: 6
      mean_delta_pct: -9.2
      worst_pair: "medicine+physics (-45%)"
      best_pair: "math+biology (+20%)"
      medicine_mean_delta: -37.8
      philosophy_mean_delta: +11.7
      cross_eval_distance_correlation_r: 0.197
      pace_job_id: 6126072
      runtime_hours: 11.6
    figures:
      - results/pace_domain_10/figures/collab_delta_heatmap.png
      - results/pace_domain_10/figures/solo_vs_collab_delta.png
      - results/pace_domain_10/figures/distance_vs_collab_delta.png
    conclusions: >
      Multi-agent collaboration is net harmful (-9.2% mean). Vulnerability is an
      intrinsic property of the primary domain: medicine/chemistry/physics collapse
      regardless of helper, while philosophy/law/math benefit regardless. This
      suggests epistemic fragility vs robustness in LoRA-specialized knowledge.
    connects_to: obj-012
    completed_date: "2026-04-02"

