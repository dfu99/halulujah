- id: obj-042
  statement: "2026-04-27 audit caught empty <think> chains; archived all PACE pre-RP data"
  methodology: >
    Inspected the trial-level chain field of `pace_domain_10/collaboration/
    collab_results.json` (1800 collaboration trials = 10 domains x 20
    questions x 9 cross-domain pair conditions). Each trial contained a
    serialized chain of agent turns. Across all trials the agent turns
    showed the pattern `<think>\\n\\n</think>\\n\\nA. <answer>` - the
    `<think>` block was empty and the agent emitted the multiple-choice
    answer letter directly without intermediate reasoning. Later turns in
    the same chain copied the primary's verbatim answer rather than
    producing independent reasoning. See `chain_examples.md` in the
    archive for verbatim transcript samples.
    Categorized each trial by collaboration outcome with a small heuristic
    grader: confident_wrong (chain converged to wrong answer with no
    reasoning), extraction_failure (no parseable answer letter), or
    answer_switch (correct primary answer flipped to wrong after helper
    turn). Cross-tabulated by domain.
    Cause: the 1.7B specialists had been trained before the
    reasoning-preserved (RP) format fix. Lessons.md flagged the
    empty-think-tag pathology with the fix on 2026-04-12, but the bad
    chains were not retroactively removed from the analysis pipeline.
    The 22.3x cluster-corrected primary/helper variance ratio in
    `stats_rework/summary.json` was computed from these bad chains.
    Statistical method (question-clustered bootstrap, mixed-effects
    variance decomposition, BH-FDR pair table) was sound; the chains
    were not.
  metrics:
    n_trials_total: 1800
    n_trials_failed: 1101
    fail_rate_pct: 61.2
    confident_wrong: 546
    extraction_failure: 322
    answer_switch: 233
    success_total: 699
    success_confirmation: 507
    success_correction: 125
    success_elaboration: 67
    worst_failure_domain: "medicine (167 fails, 147 from extraction_failure)"
    archived_subdirs: 6
    archived_figures: 5
    suspended_paper_claims:
      - "22x cluster-corrected primary/helper variance ratio"
      - "10x10 ANOVA variance decomposition"
      - "per-domain row-mean CIs"
  figures:
    - figures/fig_empty_think_audit.png
  conclusions: >
    The PACE pre-RP collaboration corpus is not measuring deliberation -
    it is measuring direct-answer-then-copy. Any statistical claim about
    primary/helper asymmetry built on this corpus is suspect because the
    underlying trials did not exercise the reasoning pathway the claim
    is about. Archived all derived data to
    `archive/pre_RP_polluted_2026-04-27/` and pinned a NOT-CURRENT-DATA
    notice to its README.
    The RP-format 1.7B 10x10 N=200 run already in flight on
    `/workspace/adapters_1p7b` would have been the regeneration source.
    However, the 2026-04-29 follow-up addition to this archive
    (`ood_medqa_PACE_specialist/`) showed that even with RP format, the
    1.7B medicine specialist scored 46% on MedQA-USMLE while the 1.7B
    base scored 58% on MMLU-medicine - the specialists were MMLU-format
    pattern-matchers, not domain-knowledge specialists. PI directed a
    full pivot to verified domain specialists.
    Net consequence chain: empty-think audit -> archive -> RP-format
    regeneration in flight -> 2026-04-28 OOD diagnosis -> 2026-04-29
    abort + verified-specialist gate -> verified 5x5 LoRA pair-grid
    on 2026-05-03 (obj-040) with WHO-asymmetry ratio 4.47x (down from
    polluted 22.3x).
    The 4.47x in obj-040 is the honest replacement number for the
    suspended 22.3x.
  connects_to: obj-043
  completed_date: "2026-04-27"

- id: obj-043
  statement: "Question-clustered bootstrap on PACE pre-RP corpus: 22.3x [10.2, 48.0] (suspended)"
  methodology: >
    Re-analyzed the 1800-trial PACE 10-domain n=20 corpus with stronger
    error-bar machinery to handle the within-question dependence the
    independence-assumed analysis ignored. Two methods:
    (1) Question-clustered bootstrap for row means: resampled questions
    with replacement (cluster unit = question, not trial), recomputed each
    domain's primary-row-mean delta-vs-solo on the resampled set, repeated
    1000 times. Reported median and 2.5%/97.5% quantiles per domain.
    (2) Question-clustered bootstrap for the ANOVA primary/helper variance
    ratio: same resampling, computed primary-row variance and helper-column
    variance per resample, took the ratio. Reported median + 95% bootstrap
    CI.
    (3) BH-FDR correction across 90 ordered (primary, helper) pairs from
    pair-level t-tests on the polluted deltas.
    All three methods are statistically sound. The substrate they were
    applied to (the empty-think chains caught by obj-042) was not.
  metrics:
    n_trials: 1800
    n_domains: 10
    n_bootstrap: 1000
    primary_var_mean: 3.2158
    helper_var_mean: 0.1533
    asymmetry_ratio_median: 22.27
    asymmetry_ratio_ci_95: "[10.24, 48.01]"
    n_pairs_total: 90
    n_pairs_sig_uncorrected: 25
    n_pairs_sig_bh_fdr: 22
    spearman_rho_1p7B_vs_4B_row_means: -0.3
    spearman_p_value: 0.624
    most_negative_row_mean: "medicine -38.0 pp [-58.9, -17.2]"
    most_positive_row_mean: "philosophy +11.0 pp [-12.2, +32.8]"
  figures:
    - figures/fig_clustered_bootstrap_suspended.png
  conclusions: >
    The 22.3x cluster-corrected primary/helper variance ratio with 95% CI
    [10.24, 48.01] would have been the headline statistical result of the
    paper. After the 2026-04-27 empty-think audit (obj-042) it is
    SUSPENDED. The chains the bootstrap was applied to did not exercise
    the deliberation pathway the ratio is supposed to characterize.
    BH-FDR-significant pair table (22 of 90) - mostly medicine, chemistry,
    physics primaries with -30 to -45 pp deltas - all SUSPENDED for the
    same reason. Spearman rho between 1.7B and 4B row means was -0.3
    (p=0.62, n.s.), already a warning that the specific harmed/helped
    domain identities were not robust across scale; in retrospect this
    was an early signal of the underlying format-pattern-matching artifact
    that the 2026-04-29 OOD test confirmed.
    Honest replacement: obj-040 ran a fresh 45-condition pair-grid on the
    five verified Qwen3-1.7B LoRA specialists and got asymmetry ratio
    *4.47x* (row spread 34 pp, col spread 7.6 pp). Same direction, much
    smaller magnitude. The verified-specialist 4.47x should be cited
    going forward instead of the 22.3x.
    Method is reusable: when the verified Full FT pair-grid completes,
    apply the same question-clustered bootstrap + BH-FDR machinery to its
    matrix_results.json to produce a new credible interval for the LoRA
    vs Full FT comparison.
  connects_to: null
  completed_date: "2026-04-27"
- id: obj-044
  statement: "Audit §6g–§6k deepening: X-parsing pollution, helper quality, stickiness, entropy"
  methodology: >
    Re-derived audit metrics from results/verified_pair_grid_qwen3_1p7b/
    matrix_results.json. Extracted per-cell switch types (held/c2w/w2c/other),
    parsing-failure breakdown of pre_a (51.6% are 'X'), per-helper
    self-solo accuracy, per-cell pre/post answer-distribution Shannon
    entropy. Cross-tabulated and computed Spearman/Pearson correlations
    across the 30 cells (5 primaries × 6 helpers). Findings driving the
    headline updates documented as audit §6g (X-parsing pollution),
    §6h (helper-quality regression), §6i (held vs flips), §6k (entropy).
  metrics:
    pre_a_X_rate_pooled: 0.516
    w2c_X_recovery_share: 0.675
    letter_only_rate_ratio_pooled: 0.92
    letter_only_rate_ratio_x_inclusive_was: 0.70
    n_primaries_letter_only_above_1: 3
    helper_quality_pearson_r: 0.514
    held_vs_w2c_w_spearman: -0.919
    held_vs_c2w_c_spearman: 0.075
    pooled_pre_entropy_bits: 1.845
    pooled_post_entropy_bits: 2.297
    entropy_shift_bits: 0.452
  figures:
    - figures/audit-2026-05-05.png
  conclusions: >
    The §6a "rate ratio 0.70 (net-helpful)" headline is mostly an artifact
    of pre-collaboration parsing failures — the agent emitted no parseable
    letter on the 1-pass extraction (X), and post-deliberation produced a
    valid letter, which mechanically lands in the W2C bucket whether or
    not the model actually changed its answer. Letter-only pooled rate
    ratio is 0.92 (essentially balanced), and 3 of 5 primaries flip
    above 1.0 (math 1.54, law 2.04, physics 1.24). Stickiness is
    strongly anti-correlated with recovery (ρ = -0.92) but uncorrelated
    with C2W preservation (ρ = +0.08), confirming rank-amplification is
    asymmetric in *direction* not *magnitude*. Better specialists are
    better helpers (Pearson +0.51). Deliberation diffuses the answer
    distribution rather than collapsing to consensus (post entropy
    +0.45 bits). All four findings revise the paper-defensible directives
    in §10.
  connects_to: obj-045
  completed_date: "2026-05-05"
