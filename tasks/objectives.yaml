      - results/runpod_domain/figures/kl_vs_hallucination_scatter.png
      - results/runpod_domain/figures/domain_cross_hallucination.png
    conclusions: >
      LoRA fine-tuning massively improves over base (18% → 55% avg). Biology specialist
      shows strongest in-domain advantage (70% vs 53% cross, +17% drop). KL divergence
