- id: obj-047
  statement: "Pair-swap delta scatter (figure-1 candidate): mean swap 25.6 pp, max 46 pp"
  methodology: >
    For every off-diagonal cross-domain pair in the verified 5×5 grid,
    plotted delta_pair_X_Y (X primary, Y helper) vs delta_pair_Y_X (Y
    primary, X helper), where delta = pair_acc − solo_primary. First draft
    used raw pair-accuracy axes; mid-session correction: the two cells in
    a swap use DIFFERENT primary-domain question sets, so raw accuracy
    conflates domain difficulty with help-asymmetry. Re-derived using
    deltas which subtract each primary's solo competence on its own
    questions. Standalone figure src/scripts/plot_pair_swap_asymmetry.py
