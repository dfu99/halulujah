  - id: obj-012
    status: completed
    statement: "Paper revision addresses all 5 unanimous reviewer critiques, upgrades consensus to Minor Revision"
    methodology: >
      Computed bootstrap 95% CIs (10K resamples) on all 90 collab pairs and 10 solo baselines.
      Ran two-way ANOVA for variance decomposition (primary domain × helper domain).
      Classified 1,101 failed chains into failure modes. Revised full paper: scoped title,
      replaced anthropomorphic language, integrated statistical analyses. Re-simulated 5 expert
      reviewers on revised paper.
    metrics:
      bootstrap_ci_width_mean: "±17.9pp"
      anova_primary_eta_sq: 0.131
      anova_primary_F: 29.25
      anova_primary_p: "<0.001"
      anova_helper_eta_sq: 0.005
      failure_confident_wrong: "49.6%"
      failure_extraction: "29.2%"
      failure_answer_switch: "21.2%"
      success_correction_rate: "17.9%"
      round1_verdict: "5/5 Major Revision"
      round2_verdict: "4/5 Minor, 1/5 Accept"
    figures:
      - results/pace_domain_10/figures/paper_summary_4panel.png
      - results/pace_domain_10/figures/bootstrap_ci_forest.png
      - results/pace_domain_10/figures/chain_failure_modes.png
      - results/pace_domain_10/figures/variance_decomposition.png
    conclusions: >
      The revised paper successfully addresses all 5 unanimous reviewer critiques.
      ANOVA shows primary domain explains 26x more variance than helper (13.1% vs 0.5%),
      providing statistical rigor for the intrinsic vulnerability claim. Chain analysis
      reveals answer switching (21.2%) as the key harmful mechanism. All 5 reviewers
      upgraded from Round 1, with consensus moving from Major to Minor Revision.
    connects_to: obj-013
    completed_date: "2026-04-02"

  - id: obj-013
    status: completed
    statement: "Base Qwen3-1.7B scores 15.4% on MMLU — 35pp below LoRA specialists"
    methodology: >
      Evaluated raw Qwen3-1.7B (no LoRA) across all 10 MMLU domains with 50 questions
      each using identical test splits (seed=42) and grading pipeline as specialist
      experiments. Ran on RunPod RTX A4500. Compared against specialist solo baselines
      averaged across 3 communication protocols.
    metrics:
      base_mean_accuracy: 15.4
      specialist_mean_accuracy: 50.4
      accuracy_gap_pp: 35.0
      base_best_domain: "biology/economics (24%)"
      base_worst_domain: "CS/history/math (8%)"
      random_chance: 25
      n_questions_total: 500
      runtime_minutes: 34.0
      domains_evaluated: 10
    figures:
      - results/runpod_domain/figures/base_vs_specialist_solo.png
    conclusions: >
      Base Qwen3-1.7B performs below random chance (15.4% vs 25%) on MMLU MCQ,
      confirming that LoRA fine-tuning is essential for domain competence. The 35pp
      gap to specialists (50.4%) means the base model is effectively a noise source.
      This baseline is critical for the base-as-helper collaboration control: if
      specialist+base performs similarly to specialist+cross-domain-specialist, the
      damage comes from any noisy partner; if cross-domain is worse, the damage
      comes from conflicting expertise specifically.
    connects_to: obj-014
    completed_date: "2026-04-11"

  - id: obj-014
    status: completed
    statement: "Base-as-helper improves specialists +9pp; cross-domain specialists harm -8.7pp"
    methodology: >
      Ran base-as-helper collaboration on RunPod RTX A4500: each domain specialist
      collaborates with raw Qwen3-1.7B (no LoRA) via full-cot protocol (3 rounds,
      50 questions per domain, 10 domains = 500 total). Compared convergence dynamics
      against specialist+specialist cross-domain collaboration from prior experiment.
    metrics:
      solo_specialist_accuracy: 50.2
      base_helper_collab_accuracy: 59.2
      base_helper_delta_pp: +9.0
      same_domain_specialist_delta_pp: +3.6
      cross_domain_specialist_delta_pp: -8.7
      base_helper_c2w_rate: 14.6
      cross_domain_c2w_rate: 26.3
      base_helper_w2c_rate: 11.0
      cross_domain_w2c_rate: 7.7
      base_model_pre_collab_accuracy: 13.0
      specialist_pre_collab_accuracy: 62.8
      post_collab_accuracy: 59.2
      convergence_delta_pp: -3.6
      switch_rate: 35.4
      n_questions: 500
      domains: 10
      protocol: full-cot
      rounds: 3
      biggest_gain_domain: "physics (+26pp)"
      runtime_hours: ~3.5
    figures:
      - results/runpod_domain/figures/base_helper_vs_specialist_collab.png
    conclusions: >
      Cross-domain damage comes from CONFLICTING EXPERTISE, not noise. A base model
      (13% accuracy) as helper actually improves specialists by +9pp because it triggers
      extended reasoning without imposing confidently wrong answers. Cross-domain
      specialists cause 1.8x more correct→wrong switches (26.3% vs 14.6%). This
      directly supports the mediator hypothesis: loosely coupled, non-expert partners
      preserve epistemic independence better than tightly coupled wrong-domain experts.
    connects_to: obj-016
    completed_date: "2026-04-11"

- id: obj-015
  statement: "Ratio sweep proves mix ratio is irrelevant; LoRA training itself causes collaboration damage"
  methodology: >
    Trained 9 mediator LoRA adapters at mix ratios from 90/10 to 10/90 (medicine+physics).
    Evaluated specialist+mediator collaboration on 50 medicine questions with 3-round full-cot protocol.
  metrics:
    collab_accuracy_range: "10-18% across all 9 ratios"
    c2w_range: "25-31 / 50 questions"
    w2c_range: "0-2 / 50 questions"
    delta_range: "-50pp to -64pp"
    n_ratios: 9
    n_questions: 50
    training_time_hours: 5.3
  figures:
    - results/runpod_domain/ratio_sweep/ratio_sweep_curve.png
  conclusions: >
    Mix ratio is completely irrelevant. Collab accuracy locked at 10-18% regardless
    of whether mediator is 90/10 or 10/90. C2W consistently 25-31, W2C consistently 0-2.
    The damage mechanism is LoRA training itself, not data composition.
  connects_to: obj-016
  completed_date: "2026-04-12"

- id: obj-016
  statement: "LoRA rank ablation reveals rank controls switching quantity, not quality"
  methodology: >
    Trained medicine specialists at LoRA ranks r=4, r=8, r=32 (r=16 from prior experiment).
    Evaluated solo accuracy and collaboration with base model helper on 50 questions.
    Extracted training entropy as rigidity proxy.
  metrics:
    ranks_tested: [4, 8, 16, 32]
    solo_accuracy_r4: 54
    solo_accuracy_r8: 48
    solo_accuracy_r16: 72
    solo_accuracy_r32: 66
    base_collab_delta_r4: -10
    base_collab_delta_r8: +2
    base_collab_delta_r16: -6
    base_collab_delta_r32: -10
    c2w_w2c_ratio_range: "1.2x to 1.7x (all ranks, base helper)"
    train_entropy_r4: 0.865
    train_entropy_r8: 0.851
    train_entropy_r32: 0.749
    switch_rate_r4: 54
    switch_rate_r8: 48
    switch_rate_r16: 30
    switch_rate_r32: 38
    base_solo_accuracy: 21
    total_time_minutes: 153
  figures:
    - results/runpod_domain/rank_ablation/rank_ablation_curve.png
  conclusions: >
    Training entropy drops monotonically with rank (0.865→0.851→0.749), confirming
    higher rank = more confident model. Switch rate also drops with rank (54%→48%→38%).
    But C2W/W2C ratio stays stable at 1.2-1.7x across all ranks with base helper —
    much lower than cross-domain (3.4x) or mediator (7.1x). Rank controls how often
    the specialist changes its mind (quantity), but the helper's training determines
    whether those changes are harmful (quality). The damage amplifier is conflicting
    expertise in the helper, not rigidity in the specialist.
  connects_to: obj-019
  completed_date: "2026-04-12"

