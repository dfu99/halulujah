- objective: I've got two additional pivot ideas. One, can we create and measure personality?
    Produce a set of questions that a human answers genuinely. Fine-tune on answers
    from different humans. Does this create a measurable shift in token distribution
    and a spectral fingerprint of a different personality? Does hallucinations then
    corrupt or weaken the boundaries between those distributions? Two, how much common
    domain knowledge is required for two LLMs with distinct domain knowledge to collaborate
    effectively? Find distinct cleaves of information, e.g. a physicist and a biologist
    or lawyer or politician or salesperson. I think we start with training an LLM
    to "not understand". So we need a measure of domain complexity, perhaps measured
    in jargon or concepts. Then train the LLM to respond with confusion or misunderstanding
    past a certain degree of complexity. This is kind of reversing LLM general intelligence
    but with a clear use case. I think it would be actually quite novel? Or am I unaware
    of progress in this scope?
